<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <header class="cabecalho">
        <nav class="menu">
            <a class="menu_secao" href="./index.html">Home</a>
            <a class="menu_secao" href="./about.html">Sobre mim</a>
            <a class="menu_secao" href="./skills.html">Skills</a>
        </nav>
    </header>
    <main class="conteudo conteudo_skills">
        <section class="skills_secao">
            <h1 class="titulo">Minhas Skills</h1>
            <ul class="skills_lista">
                <li class="skill_card">
                    <img class="skill_icone"
                        src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg"
                        alt="Ícone do HTML5">
                    <span class="skill_nome">HTML5</span>
                    <span class="skill_nivel">Básico</span>
                </li>
                <li class="skill_card">
                    <img class="skill_icone"
                        src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/css3/css3-original.svg"
                        alt="Ícone do CSS3">
                    <span class="skill_nome">CSS3</span>
                    <span class="skill_nivel">Básico</span>
                </li>
                <li class="skill_card">
                    <img class="skill_icone" src="./assets/flex.svg" alt="Ícone de layout">
                    <span class="skill_nome">Flexbox &amp; Grid</span>
                    <span class="skill_nivel">Básico</span>
                </li>
                <li class="skill_card">
                    <img class="skill_icone" src="./assets/logic.svg" alt="Ícone de lógica">
                    <span class="skill_nome">Lógica de Programação</span>
                    <span class="skill_nivel">Básico</span>
                </li>
                <li class="skill_card">
                    <img class="skill_icone" src="./assets/responsive.svg" alt="Ícone de responsividade">
                    <span class="skill_nome">Responsividade</span>
                    <span class="skill_nivel skill_nivel--aprendizado">Em aprendizado</span>
                </li>
            </ul>
        </section>
    </main>
    <footer class="rodape">
        <p>Desenvolvido por Victor Emanuel | Instruido por Alura.</p>
    </footer>
</body>

</html>
